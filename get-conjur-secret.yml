---
- name: Get secret from Conjur via JWT
  hosts: all
  gather_facts: false
  vars:
    conjur_url: "http://leader.conjurlab.com"
    conjur_account: "admin"
    authn_id: "awx-v2"

  tasks:
    - name: Get AWX JWT token
      uri:
        url: "http://192.168.1.99:30090/api/v2/users/me/"
        method: GET
        headers:
          Authorization: "Bearer {{ lookup('env', 'AWX_TOKEN') }}"
        return_content: yes
        validate_certs: false
      register: awx_me
      delegate_to: localhost

    - name: Authenticate to Conjur with JWT
      uri:
        url: "{{ conjur_url }}/authn-jwt/{{ authn_id }}/{{ conjur_account }}/authenticate"
        method: POST
        headers:
          Content-Type: "application/x-www-form-urlencoded"
          Accept: "application/json"
        body: "jwt={{ lookup('env', 'AWX_TOKEN') }}"
        return_content: yes
        validate_certs: false
        status_code: 200
      register: conjur_token
      delegate_to: localhost

    - name: Get SSH username from Conjur
      uri:
        url: "{{ conjur_url }}/secrets/{{ conjur_account }}/variable/awx%2Fssh%2Fusername"
        method: GET
        headers:
          Authorization: "Token token=\"{{ conjur_token.content | b64encode }}\""
        return_content: yes
        validate_certs: false
      register: ssh_username
      delegate_to: localhost

    - name: Get SSH password from Conjur
      uri:
        url: "{{ conjur_url }}/secrets/{{ conjur_account }}/variable/awx%2Fssh%2Fpassword"
        method: GET
        headers:
          Authorization: "Token token=\"{{ conjur_token.content | b64encode }}\""
        return_content: yes
        validate_certs: false
      register: ssh_password
      delegate_to: localhost

    - name: Show result (demo only)
      debug:
        msg: "Username: {{ ssh_username.content }}"
